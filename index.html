<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalletKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen" class="pin-screen">
  <div class="pin-card">
    <div class="pin-logo">◈ WalletKu</div>
    <p class="pin-sub" id="pinSub">Masukkan PIN untuk membuka</p>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="pin-pad">
      <button class="pin-btn" data-val="1">1</button>
      <button class="pin-btn" data-val="2">2</button>
      <button class="pin-btn" data-val="3">3</button>
      <button class="pin-btn" data-val="4">4</button>
      <button class="pin-btn" data-val="5">5</button>
      <button class="pin-btn" data-val="6">6</button>
      <button class="pin-btn" data-val="7">7</button>
      <button class="pin-btn" data-val="8">8</button>
      <button class="pin-btn" data-val="9">9</button>
      <button class="pin-btn pin-btn--empty"></button>
      <button class="pin-btn" data-val="0">0</button>
      <button class="pin-btn pin-btn--del" id="pinDel">⌫</button>
    </div>
    <div class="pin-hint" id="pinHint"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">◈ <span>WalletKu</span></div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard">
        <span class="nav-icon">⬡</span><span>Dashboard</span>
      </button>
      <button class="nav-item" data-page="wallets">
        <span class="nav-icon">◎</span><span>Wallets</span>
      </button>
      <button class="nav-item" data-page="transactions">
        <span class="nav-icon">⟳</span><span>Transaksi</span>
      </button>
      <button class="nav-item" data-page="goals">
        <span class="nav-icon">◉</span><span>Target</span>
      </button>
      <button class="nav-item" data-page="export">
        <span class="nav-icon">↗</span><span>Export</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-lock" id="lockBtn">🔒 Kunci App</button>
      <div class="sidebar-ver">WalletKu v2.0</div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN -->
  <div class="main" id="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbarDate"></span>
      </div>
    </header>

    <div class="content" id="content">
      <!-- Pages injected by JS -->
    </div>
  </div>
</div>

<!-- MODALS -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toastContainer" class="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
