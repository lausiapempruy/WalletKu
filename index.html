<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalletKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="particleCanvas"></canvas>

<!-- PIN SCREEN -->
<div id="pinScreen" class="pin-screen">
  <div class="pin-card">
    <div class="pin-logo"><span class="logo-glow">◈</span> WalletKu</div>
    <p class="pin-sub" id="pinSub">Masukkan PIN untuk membuka</p>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="pin-pad">
      <button class="pin-btn" data-val="1">1</button>
      <button class="pin-btn" data-val="2">2</button>
      <button class="pin-btn" data-val="3">3</button>
      <button class="pin-btn" data-val="4">4</button>
      <button class="pin-btn" data-val="5">5</button>
      <button class="pin-btn" data-val="6">6</button>
      <button class="pin-btn" data-val="7">7</button>
      <button class="pin-btn" data-val="8">8</button>
      <button class="pin-btn" data-val="9">9</button>
      <button class="pin-btn pin-btn--empty"></button>
      <button class="pin-btn" data-val="0">0</button>
      <button class="pin-btn pin-btn--del" id="pinDel">⌫</button>
    </div>
    <div class="pin-hint" id="pinHint">💡 Ketik langsung dari keyboard</div>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen hidden">
  <div class="login-card" id="loginCard">
    <div class="login-logo"><span class="logo-glow">◈</span><span>WalletKu</span></div>
    <div class="login-badge" id="loginBadge">Selamat Datang</div>
    <h2 class="login-title" id="loginTitle">Masuk ke Akun</h2>
    <p class="login-sub" id="loginSub">Masukkan username kamu</p>
    <div class="login-form" id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-glow-wrap">
          <input class="form-input" id="usernameInput" placeholder="username kamu..." autocomplete="off" maxlength="24" />
          <div class="input-glow"></div>
        </div>
      </div>
      <div id="loginError" class="login-error"></div>
      <button class="btn btn-primary btn-full" id="loginBtn">
        <span id="loginBtnText">Masuk</span>
        <span class="btn-shine"></span>
      </button>
      <div class="login-switch" id="loginSwitch"></div>
    </div>
    <div class="login-countdown hidden" id="loginCountdown">
      <div class="countdown-ring">
        <svg viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
          <circle cx="30" cy="30" r="26" fill="none" stroke="var(--gold)" stroke-width="3"
            stroke-dasharray="163" stroke-dashoffset="163" id="countdownCircle"
            stroke-linecap="round" transform="rotate(-90 30 30)"/>
        </svg>
        <span id="countdownNum">3</span>
      </div>
      <div class="countdown-text" id="countdownText">Menyiapkan sesi...</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">◈ <span>WalletKu</span></div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <div class="sidebar-user" id="sidebarUser">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info">
        <div class="user-name" id="userName">—</div>
        <div class="user-status">● Online</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⬡</span><span>Dashboard</span></button>
      <button class="nav-item" data-page="wallets"><span class="nav-icon">◎</span><span>Wallets</span></button>
      <button class="nav-item" data-page="transactions"><span class="nav-icon">⟳</span><span>Transaksi</span></button>
      <button class="nav-item" data-page="goals"><span class="nav-icon">◉</span><span>Target</span></button>
      <button class="nav-item" data-page="export"><span class="nav-icon">↗</span><span>Export</span></button>
      <button class="nav-item" data-page="changelog"><span class="nav-icon">📋</span><span>Changelog</span></button>
      <button class="nav-item" data-page="shortcuts"><span class="nav-icon">⌨</span><span>Shortcuts</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      <div class="nav-divider"></div>
      <button class="nav-item nav-recap" id="recapNavBtn"><span class="nav-icon">✦</span><span>WalletKu Recap</span><span class="recap-badge" id="recapBadge"></span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-lock" id="lockBtn">🔒 Kunci App</button>
      <div class="sidebar-ver">WalletKu v2.2</div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main" id="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-right">
        <span class="topbar-greeting" id="topbarGreeting"></span>
        <span class="topbar-date" id="topbarDate"></span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toastContainer" class="toast-container"></div>

<script src="wallet.js"></script>
</body>
</html>
