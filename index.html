<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WalletKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- AURORA BACKGROUND -->
<div class="aurora-bg" aria-hidden="true">
  <div class="aurora-orb aurora-1"></div>
  <div class="aurora-orb aurora-2"></div>
  <div class="aurora-orb aurora-3"></div>
  <div class="aurora-orb aurora-4"></div>
  <div class="noise-overlay"></div>
</div>

<!-- CURSOR GLOW -->
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<!-- ═══════════════════════════════
     PIN SCREEN
═══════════════════════════════ -->
<div id="pinScreen" class="pin-screen">
  <div class="pin-island">
    <div class="pin-logo">
      <div class="pin-logo-mark">◈</div>
      <span>WalletKu</span>
    </div>
    <p class="pin-sub" id="pinSub">Enter your PIN</p>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="pin-grid">
      <button class="pin-key" data-val="1"><span>1</span></button>
      <button class="pin-key" data-val="2"><span>2</span><small>ABC</small></button>
      <button class="pin-key" data-val="3"><span>3</span><small>DEF</small></button>
      <button class="pin-key" data-val="4"><span>4</span><small>GHI</small></button>
      <button class="pin-key" data-val="5"><span>5</span><small>JKL</small></button>
      <button class="pin-key" data-val="6"><span>6</span><small>MNO</small></button>
      <button class="pin-key" data-val="7"><span>7</span><small>PQRS</small></button>
      <button class="pin-key" data-val="8"><span>8</span><small>TUV</small></button>
      <button class="pin-key" data-val="9"><span>9</span><small>WXYZ</small></button>
      <button class="pin-key pin-key--empty"></button>
      <button class="pin-key" data-val="0"><span>0</span></button>
      <button class="pin-key pin-key--del" id="pinDel">⌫</button>
    </div>
    <div class="pin-hint" id="pinHint">💡 Type digits directly from keyboard</div>
  </div>
</div>

<!-- ═══════════════════════════════
     LOGIN SCREEN
═══════════════════════════════ -->
<div id="loginScreen" class="login-screen hidden">
  <div class="login-island">
    <div class="login-glyph">◈</div>
    <div class="login-pill" id="loginPill">Welcome</div>
    <h1 class="login-title" id="loginTitle">Sign In</h1>
    <p class="login-sub" id="loginSub">Enter your username to continue</p>
    <div id="loginForm" class="login-form-wrap">
      <div class="field-wrap">
        <input class="glass-input" id="usernameInput" placeholder="username" autocomplete="off" maxlength="24"/>
        <div class="field-shine"></div>
      </div>
      <div id="loginError" class="field-error"></div>
      <button class="btn-primary-glass" id="loginBtn">
        <span id="loginBtnText">Continue</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <div class="login-switch" id="loginSwitch"></div>
    </div>
    <div id="loginCountdown" class="login-countdown hidden">
      <div class="countdown-arc">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"
            stroke-dasharray="176" stroke-dashoffset="176" id="countdownCircle"
            stroke-linecap="round" transform="rotate(-90 32 32)"/>
        </svg>
        <span id="countdownNum">3</span>
      </div>
      <p id="countdownText" class="countdown-text">Preparing session…</p>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════
     APP SHELL
═══════════════════════════════ -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar glass-sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">◈ <span>WalletKu</span></div>
      <button class="sidebar-close-btn" id="sidebarClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="sidebar-user-card" id="sidebarUserCard">
      <div class="user-avatar-ring" id="userAvatar">A</div>
      <div>
        <div class="user-display-name" id="userName">—</div>
        <div class="user-online-dot"><span></span>Active now</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <button class="nav-pill active" data-page="dashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-pill" data-page="wallets">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/><circle cx="18" cy="16" r="1"/></svg>
        Wallets
      </button>
      <button class="nav-pill" data-page="transactions">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6l4-4 4 4M16 18l-4 4-4-4M12 2v20"/></svg>
        Transactions
      </button>
      <button class="nav-pill" data-page="recurring">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109 9"/><path d="M3 3v6h6M21 12a9 9 0 01-9-9"/></svg>
        Recurring
      </button>
      <button class="nav-pill" data-page="budget">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Budget
      </button>

      <div class="nav-section-label" style="margin-top:8px">Goals & Planning</div>
      <button class="nav-pill" data-page="goals">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        Savings Goals
      </button>
      <button class="nav-pill" data-page="wishlist">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        Wishlist
      </button>

      <div class="nav-section-label" style="margin-top:8px">Insights</div>
      <button class="nav-pill" data-page="analytics">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Analytics
      </button>
      <button class="nav-pill" data-page="notes">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Notes
      </button>

      <div class="nav-section-label" style="margin-top:8px">System</div>
      <button class="nav-pill" data-page="export">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="nav-pill" data-page="shortcuts">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        Shortcuts
      </button>
      <button class="nav-pill" data-page="settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
        Settings
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button class="theme-toggle-btn" id="themeToggle" title="Toggle theme">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <span id="themeLabel">Light</span>
      </button>
      <button class="lock-btn" id="lockBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Lock App
      </button>
      <div class="sidebar-version">WalletKu v2.3 · 25 Jul 2026</div>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- MAIN CONTENT -->
  <main class="main-area" id="mainArea">
    <header class="topbar glass-topbar">
      <button class="hamburger-btn" id="hamburger">
        <span></span><span></span><span></span>
      </button>
      <h1 class="topbar-title" id="topbarTitle">Dashboard</h1>
      <div class="topbar-actions">
        <div class="notif-bell" id="notifBell" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-dot hidden" id="notifDot"></span>
        </div>
        <div class="topbar-greeting" id="topbarGreeting"></div>
        <div class="topbar-date" id="topbarDate"></div>
      </div>
    </header>

    <!-- NOTIFICATION PANEL -->
    <div class="notif-panel glass-panel hidden" id="notifPanel">
      <div class="notif-panel-header">
        <span>Notifications</span>
        <button id="clearNotifs" class="notif-clear-btn">Clear all</button>
      </div>
      <div id="notifList" class="notif-list"></div>
    </div>

    <div class="page-content" id="pageContent"></div>
  </main>
</div>

<!-- MODAL SYSTEM -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal-sheet glass-modal" id="modalSheet">
    <div class="modal-drag-handle"></div>
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">—</h2>
      <button class="modal-x-btn" id="modalClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TOAST RACK -->
<div class="toast-rack" id="toastRack" aria-live="polite"></div>

<!-- QUICK ADD FAB -->
<button class="fab-add" id="fabAdd" title="Quick add transaction">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<script src="app.js"></script>
</body>
</html>
